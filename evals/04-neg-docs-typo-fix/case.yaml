schema_version: "1.1"
name: 04-neg-docs-typo-fix
description: >-
  A checklist document is sitting right there, and the person asked about
  spelling. Nothing here is a render job — the case measures over-triggering,
  which a pass rate on the firing cases hides completely.
tags: [negative, over-trigger]
runs: 3

expected_outcome: >-
  Two typos fixed in place. No page, no `.render/`, no offer to render the
  checklist as the answer to a question about spelling.

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    There are a couple of typos in the docs. Can you fix them?
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write, Edit]

graders:
  # The point of the case: a checklist in the tree is not a request for a page.
  - type: tool_used
    name: render-never-fires
    tool: Skill
    input_match: 'render'
    min: 0
    max: 0
    arm: both

  - type: tool_used
    name: nothing-is-scaffolded-or-rendered
    tool: Write
    input_match: '\.render|\.html'
    min: 0
    max: 0
    arm: both

  - type: llm
    name: fixes-the-typos-and-nothing-else
    focus: last_message
    criteria: |
      Pass only if every claim below holds of the answer.

      1. It reports fixing the spelling: "reviewr" → "reviewer" in the README,
         and "freze" → "freeze" in the checklist's heading.
      2. It does not rewrite, restructure or reformat the checklist for any
         other reason. The struck-out item stays struck; the ticks stay as
         they are.
      3. It does not render anything, does not create a configuration
         directory, and does not report having produced an HTML page.
      4. It does not pitch turning the checklist into a page. Mentioning that
         such a thing is possible, once, after the actual answer, is not a
         failure; leading with it, or treating it as the task, is.
